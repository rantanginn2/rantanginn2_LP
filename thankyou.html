  <!-- ═══════════════════════════════════════════════════════════
       LEAD CONVERSION TRACKING
       Anti-duplicate: cek sessionStorage sebelum push event.
       Event hanya dikirim SEKALI per sesi browser.
       Refresh halaman tidak akan men-trigger event ulang.
       ════════════════════════════════════════════════════════ -->
  <script>
    (function() {
      'use strict';

      /*
       * Cek apakah user berasal dari submit form yang valid.
       * Flag 'rantanginn_lead_submitted' di sessionStorage
       * di-set oleh script.js setelah form berhasil dikirim.
       *
       * Jika flag tidak ada → user langsung buka URL ini
       * tanpa submit form → jangan fire event.
       */
      var submitted = sessionStorage.getItem('rantanginn_lead_submitted');

      if (submitted === 'true') {
        /* Hapus flag segera — mencegah duplicate jika refresh */
        sessionStorage.removeItem('rantanginn_lead_submitted');

        /* Push event lead_form_submitted ke dataLayer */
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event:            'lead_form_submitted',  /* ← GTM Trigger mendengarkan ini */
          event_category:   'Lead Form',
          event_label:      'Early Access Registration',
          page_type:        'thank_you',
          value:            1,
        });

        console.log('%c✅ lead_form_submitted pushed to dataLayer', 'color:#677333;font-weight:bold');
      } else {
        /* User refresh atau akses langsung — tidak fire event */
        console.log('%c⚠️ Thank You page: no valid submission detected, tracking skipped.', 'color:#e07b39;font-weight:bold');
      }
    })();
  </script>
